name: Render Keep-Alive & Uptime Bot

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier idle spin-down (15m threshold)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping GlassEye Health Endpoint
        run: |
          echo "Pinging GlassEye live health check..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://glasseye-td75.onrender.com/health")
          echo "Received HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "GlassEye is alive and healthy!"
          else
            echo "Warning: Health check returned status $HTTP_CODE (may be waking up)"
            sleep 5
            curl -s -f --max-time 25 "https://glasseye-td75.onrender.com/health" || exit 1
          fi
